# Local development config template rendered and imported into Nacos (Data ID: roaming-world.yaml)
# Placeholders (__POSTGRES_PASSWORD__, __REDIS_PASSWORD__, __MEILI_MASTER_KEY__) are substituted by nacos-init.
postgre:
  host: postgres
  port: 5432
  user: roaming
  password: "__POSTGRES_PASSWORD__"
  dbname: roaming_world
  sslmode: disable

redis:
  host: redis
  port: 6379
  password: "__REDIS_PASSWORD__"
  db: 0

kafka:
  address: kafka:9092
  topic:
    comment-event: comment-events

jwt:
  # nanoseconds: 30m access token, 7d refresh token
  expiration: 1800000000000
  refresh_expiration: 604800000000000

meili:
  host: http://meilisearch:7700
  key: "__MEILI_MASTER_KEY__"

email:
  host: smtp.example.com
  port: 465
  username: no-reply@example.com
  password: change-me
  from: no-reply@example.com

cos:
  bucket_url: https://example-1250000000.cos.ap-guangzhou.myqcloud.com
  secret_id: change-me
  secret_key: change-me
