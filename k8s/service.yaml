# User Service
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: roaming-world
  labels:
    app: user-service
    service: user
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: 9000
    protocol: TCP

---

