# Kratos AI gateway: validates JWT, then proxies to ai-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: roaming-world
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: roaming-world/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9000
              name: grpc
          env:
            - name: NACOS_ADDR
              value: nacos-service
            - name: NACOS_PORT
              value: "8848"
            - name: NACOS_NAMESPACE_ID
              value: ""
            - name: NACOS_DATA_ID
              value: roaming-world.yaml
            - name: NACOS_GROUP_ID
              value: DEFAULT_GROUP
            - name: AI_ENGINE_URL
              value: http://ai-service:8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: roaming-world
  labels:
    app: gateway-service
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 9000
      targetPort: 9000
