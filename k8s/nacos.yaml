# Nacos Configuration Center
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: roaming-world
  labels:
    app: nacos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
      - name: nacos
        image: nacos/nacos-server:v2.2.3
        env:
        - name: MODE
          value: "standalone"
        - name: SPRING_DATASOURCE_PLATFORM
          value: "mysql"
        - name: MYSQL_SERVICE_HOST
          value: "mysql-service"
        - name: MYSQL_SERVICE_DB_NAME
          value: "nacos_config"
        - name: MYSQL_SERVICE_PORT
          value: "3306"
        - name: MYSQL_SERVICE_USER
          value: "root"
        - name: MYSQL_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roaming-world-secrets
              key: mysql-password
        - name: NACOS_AUTH_ENABLE
          value: "true"
        - name: NACOS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: roaming-world-secrets
              key: jwt-secret
        - name: NACOS_AUTH_IDENTITY_KEY
          value: "serverIdentity"
        - name: NACOS_AUTH_IDENTITY_VALUE
          value: "security"
        ports:
        - containerPort: 8848
          name: http
        - containerPort: 9848
          name: grpc
        - containerPort: 9849
          name: grpc-rpc
        volumeMounts:
        - name: nacos-storage
          mountPath: /home/nacos/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /nacos/actuator/health
            port: 8848
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /nacos/actuator/health
            port: 8848
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: nacos-storage
        persistentVolumeClaim:
          claimName: nacos-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: nacos-service
  namespace: roaming-world
  labels:
    app: nacos
spec:
  type: ClusterIP
  selector:
    app: nacos
  ports:
  - name: http
    port: 8848
    targetPort: 8848
    protocol: TCP
  - name: grpc
    port: 9848
    targetPort: 9848
    protocol: TCP
  - name: grpc-rpc
    port: 9849
    targetPort: 9849
    protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: nacos-nodeport
  namespace: roaming-world
  labels:
    app: nacos
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
  - name: http
    port: 8848
    targetPort: 8848
    nodePort: 30848
    protocol: TCP

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-pvc
  namespace: roaming-world
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi