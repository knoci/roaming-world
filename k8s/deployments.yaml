# Scene Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-service
  namespace: roaming-world
  labels:
    app: scene-service
    service: scene
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: scene-service
  template:
    metadata:
      labels:
        app: scene-service
        service: scene
    spec:
      containers:
      - name: scene-service
        image: roaming-world/scene:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9000
          name: grpc
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: mysql-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: mysql-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: mysql-database
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: mysql-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roaming-world-secrets
              key: mysql-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: roaming-world-config
              key: redis-port
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

