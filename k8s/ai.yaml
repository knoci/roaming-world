# AI Engine: retrieval + extractive answer. No external LLM required for MVP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: roaming-world
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: roaming-world/ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: ai-provider-keys
                optional: true
          env:
            - name: AI_DB_HOST
              value: postgres-service
            - name: AI_DB_PORT
              value: "5432"
            - name: AI_DB_USER
              value: roaming
            - name: AI_DB_NAME
              value: roaming_world
            - name: AI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: postgre-password
            - name: AI_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: ai-ingest-token
            - name: QWEN_BASE_URL
              value: https://maas.qianwenaiapi.com/compatible-mode/v1
            - name: MCP_URL
              value: http://mcp-service:8000/mcp
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: mcp-token
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: roaming-world
  labels:
    app: ai-service
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
