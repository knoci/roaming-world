# 一次性 schema 迁移 Job：等 Postgres ready 后执行 001_init.sql。
# SQL 由 kustomization.yaml 的 configMapGenerator 从 deploy/postgres/migrations 生成。
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  namespace: roaming-world
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: postgre-password
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432 -U roaming -d roaming_world; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: postgre-password
          command:
            - psql
            - -h
            - postgres-service
            - -U
            - roaming
            - -d
            - roaming_world
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /migrations/001_init.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: postgres-migrations
