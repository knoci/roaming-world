# 一次性版本化 schema 迁移 Job：等 Postgres ready 后按序执行 /migrations/*.sql，
# 并通过 schema_migrations 表跳过已应用的迁移版本。
# SQL 由 kustomization.yaml 的 configMapGenerator 从 k8s/postgres-migrations 生成。
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  namespace: roaming-world
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: postgre-password
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432 -U roaming -d roaming_world; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: roaming-world-secrets
                  key: postgre-password
          command:
            - sh
            - -eu
            - -c
            - |
              psql -h postgres-service -U roaming -d roaming_world -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS schema_migrations (
                version text PRIMARY KEY,
                applied_at timestamptz NOT NULL DEFAULT now()
              );
              SQL

              for f in $(for p in /migrations/*.sql; do [ -f "$p" ] && printf '%s\n' "$p"; done | LC_ALL=C sort); do
                version=$(basename "$f")
                applied=$(printf '%s\n' "SELECT 1 FROM schema_migrations WHERE version = :'version';" | \
                  psql -h postgres-service -U roaming -d roaming_world -v ON_ERROR_STOP=1 -v version="$version" -tA)
                if [ "$applied" = "1" ]; then
                  echo "Skipping already applied migration: $version"
                  continue
                fi
                echo "Applying migration: $version"
                {
                  printf '%s %s\n' '\i' "$f"
                  printf '%s\n' "INSERT INTO schema_migrations (version) VALUES (:'version') ON CONFLICT (version) DO NOTHING;"
                } | psql -h postgres-service -U roaming -d roaming_world -v ON_ERROR_STOP=1 -v version="$version"
                echo "Applied migration: $version"
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: postgres-migrations
