# 以下是 roaming-world 项目的简化部署示例
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roaming-world-microservices
  namespace: roaming-world
  labels:
    project: roaming-world
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roaming-world
  template:
    metadata:
      labels:
        project: roaming-world
    spec:
      containers:
        - image: roaming-world/user:latest
          name: user-service
          ports:
          - containerPort: 8000
          - containerPort: 9000
        - image: roaming-world/article:latest
          name: article-service
          ports:
          - containerPort: 8000
          - containerPort: 9000