# 以下是示例配置，展示了 roaming-world 项目的部署结构
# 实际部署请使用上述文件

apiVersion: apps/v1
kind: Deployment
metadata:
  name: roaming-world-example
  namespace: roaming-world
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: roaming-world-example
  template:
    metadata:
      labels:
        app: roaming-world-example
    spec:
      containers:
        - image: roaming-world/user:latest
          name: user-service
          ports:
          - containerPort: 8000
            name: http
          - containerPort: 9000
            name: grpc
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"