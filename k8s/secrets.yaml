apiVersion: v1
kind: Secret
metadata:
  name: roaming-world-secrets
  namespace: roaming-world
type: Opaque
data:
  # MySQL数据库密码 (base64编码的"root")
  mysql-password: cm9vdA==
  # Redis密码 (如果需要)
  redis-password: ""
  # PostgreSQL密码 (base64编码的"roaming"，生产必须替换)
  postgre-password: cm9hbWluZw==
  # Meilisearch master key (base64编码的"roaming-meili-master-key"，生产必须替换)
  meili-master-key: cm9hbWluZy1tZWlsaS1tYXN0ZXIta2V5
  # JWT密钥 (base64编码的示例密钥)
  jwt-secret: bXlfc2VjcmV0X2tleV9mb3Jfand0X3Rva2Vu
  ai-ingest-token: ZGV2LWluZ2VzdC10b2tlbg==
  mcp-token: ZGV2LW1jcC10b2tlbg==

