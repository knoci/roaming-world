# 可选：需要先安装 ingress-nginx 等 Ingress Controller
# 对外统一入口，按路径前缀路由到各服务（七层）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roaming-world
  namespace: roaming-world
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: roaming.local
      http:
        paths:
          - path: /v1/user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /v1/article
            pathType: Prefix
            backend:
              service:
                name: article-service
                port:
                  number: 8000
          - path: /v1/scene
            pathType: Prefix
            backend:
              service:
                name: scene-service
                port:
                  number: 8000
          - path: /v1/food
            pathType: Prefix
            backend:
              service:
                name: food-service
                port:
                  number: 8000
          - path: /v1/comment
            pathType: Prefix
            backend:
              service:
                name: comment-service
                port:
                  number: 8000
          - path: /v1/audiobook
            pathType: Prefix
            backend:
              service:
                name: audiobook-service
                port:
                  number: 8000
