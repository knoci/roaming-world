apiVersion: v1
kind: ConfigMap
metadata:
  name: roaming-world-config
  namespace: roaming-world
data:
  # PostgreSQL（业务库）
  postgre-host: "postgres-service"
  postgre-port: "5432"
  postgre-database: "roaming_world"
  postgre-username: "roaming"
  postgre-sslmode: "disable"

  # MySQL（仅 Nacos 配置存储使用）
  # MySQL配置
  mysql-host: "mysql-service"
  mysql-port: "3306"
  mysql-database: "nacos_config"
  mysql-username: "root"
  
  # Redis配置
  redis-host: "redis-service"
  redis-port: "6379"
  
  # Nacos配置
  nacos-host: "nacos-service"
  nacos-port: "8848"
  nacos-namespace-id: ""
  nacos-data-id: "roaming-world.yaml"
  nacos-group-id: "DEFAULT_GROUP"
  
  # 服务配置
  http-timeout: "1s"
  grpc-timeout: "1s"
  redis-read-timeout: "0.2s"
  redis-write-timeout: "0.2s"

---

