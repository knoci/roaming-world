# 业务服务启动配置：只保存 Nacos 地址，业务配置从 Nacos 拉取。
apiVersion: v1
kind: ConfigMap
metadata:
  name: roaming-world-service-config
  namespace: roaming-world
data:
  config.yaml: |
    server:
      http:
        addr: 0.0.0.0:8000
        timeout: 1s
      grpc:
        addr: 0.0.0.0:9000
        timeout: 1s
    data:
      nacos:
        addr: nacos-service
        port: 8848
        namespaceId: ""
        dataId: roaming-world.yaml
        groupId: DEFAULT_GROUP