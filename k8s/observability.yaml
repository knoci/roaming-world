apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: roaming-world

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-sd
  namespace: roaming-world
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-sd
  namespace: roaming-world
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: roaming-world
roleRef:
  kind: Role
  name: prometheus-pod-sd
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: roaming-world
data:
  alerts.yml: |
    groups:
      - name: roaming-world-slo
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
          - alert: AIHigh5xxRate
            expr: (sum(rate(ai_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(ai_http_requests_total[5m])), 0.001)) > 0.05
            for: 3m
            labels:
              severity: warning
          - alert: AILLMHighLatencyP95
            expr: histogram_quantile(0.95, sum by (le, route) (rate(ai_http_request_duration_seconds_bucket[5m]))) > 15
            for: 5m
            labels:
              severity: warning
          - alert: MCPToolErrors
            expr: (sum(rate(roaming_mcp_tool_calls_total{status!="ok"}[5m])) / clamp_min(sum(rate(roaming_mcp_tool_calls_total[5m])), 0.001)) > 0.1
            for: 3m
            labels:
              severity: warning
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: roaming-world-pods
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - roaming-world
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
          - source_labels: [__meta_kubernetes_pod_label_service, __meta_kubernetes_pod_label_app]
            separator: ";"
            action: keep
            regex: "(.+;.*|.*;(ai-service|mcp-service|gateway-service))"
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: roaming-world
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: roaming-world
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
