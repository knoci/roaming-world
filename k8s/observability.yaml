# Minimal Prometheus for the metrics endpoints exposed by every service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: roaming-world
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: roaming-world
        metrics_path: /metrics
        static_configs:
          - targets:
              - user-service:8000
              - scene-service:8000
              - food-service:8000
              - comment-service:8000
              - article-service:8000
              - audiobook-service:8000
              - plan-service:8000
              - ai-service:8000
              - gateway-service:8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: roaming-world
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: roaming-world
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
