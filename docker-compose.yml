name: roaming-world

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: roaming_world
      POSTGRES_USER: roaming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/migrations:/docker-entrypoint-initdb.d:ro
      - ./deploy/postgres/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaming -d roaming_world"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDISCLI_AUTH" ]; then redis-cli --no-auth-warning ping; else env -u REDISCLI_AUTH redis-cli ping; fi']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_ENV: "development"
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  nacos:
    image: nacos/nacos-server:v2.2.3
    environment:
      MODE: "standalone"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos_data:/home/nacos/data

  nacos-init:
    image: curlimages/curl:8.8.0
    depends_on:
      nacos:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
    volumes:
      - ./deploy/nacos/roaming-world.yaml:/config/roaming-world.yaml:ro
    command:
      - sh
      - -c
      - |
        set -eu
        awk '
        function yaml_escape(s,    out, i, c) {
          out = ""
          for (i = 1; i <= length(s); i++) {
            c = substr(s, i, 1)
            if (c == "\\" || c == "\"") out = out "\\" c
            else out = out c
          }
          return out
        }
        function replace_all(str, pat, rep,    idx, res, plen) {
          res = ""
          plen = length(pat)
          while ((idx = index(str, pat)) > 0) {
            res = res substr(str, 1, idx - 1) rep
            str = substr(str, idx + plen)
          }
          return res str
        }
        BEGIN {
          pg = yaml_escape(ENVIRON["POSTGRES_PASSWORD"])
          rd = yaml_escape(ENVIRON["REDIS_PASSWORD"])
          mk = yaml_escape(ENVIRON["MEILI_MASTER_KEY"])
        }
        {
          line = $$0
          line = replace_all(line, "__POSTGRES_PASSWORD__", pg)
          line = replace_all(line, "__REDIS_PASSWORD__", rd)
          line = replace_all(line, "__MEILI_MASTER_KEY__", mk)
          print line
        }
        ' /config/roaming-world.yaml > /tmp/roaming-world.yaml

        until curl -fsS "http://nacos:8848/nacos/v1/console/health/readiness" >/dev/null 2>&1 || \
              curl -fsS "http://nacos:8848/nacos/actuator/health" >/dev/null 2>&1; do
          echo "waiting for nacos..."
          sleep 2
        done

        token=""
        for i in 1 2 3 4 5; do
          if curl -fsS -X POST "http://nacos:8848/nacos/v1/auth/login" \
            --data-urlencode "username=$$NACOS_USERNAME" \
            --data-urlencode "password=$$NACOS_PASSWORD" \
            -o /tmp/login.out; then
            token=$$(sed -n 's/.*"accessToken"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/login.out)
            if [ -n "$$token" ]; then
              break
            fi
          fi
          echo "nacos login failed (attempt $$i/5), retry..."
          sleep 2
        done
        if [ -z "$$token" ]; then
          echo "nacos login failed after 5 attempts" >&2
          exit 1
        fi

        imported=0
        for i in 1 2 3 4 5; do
          if curl -fsS -X POST "http://nacos:8848/nacos/v1/cs/configs" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "accessToken=$$token" \
            -d "dataId=roaming-world.yaml" \
            -d "group=DEFAULT_GROUP" \
            -d "type=yaml" \
            --data-urlencode "content@/tmp/roaming-world.yaml" \
            -o /tmp/import.out && [ "$$(tr -d '\r\n' < /tmp/import.out)" = "true" ]; then
            echo "import response: $$(cat /tmp/import.out)"
            imported=1
            break
          fi
          echo "import failed (attempt $$i/5), retry..."
          sleep 2
        done
        if [ "$$imported" -ne 1 ]; then
          echo "nacos config import failed after 5 attempts" >&2
          exit 1
        fi

        curl -fsS --get "http://nacos:8848/nacos/v1/cs/configs" \
          --data-urlencode "accessToken=$$token" \
          -d "dataId=roaming-world.yaml" \
          -d "group=DEFAULT_GROUP" \
          -d "tenant=" \
          -o /tmp/imported.yaml
        test -s /tmp/imported.yaml
        rm -f /tmp/roaming-world.yaml /tmp/login.out /tmp/import.out /tmp/imported.yaml
        echo "nacos config imported"

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      ARTICLE_USER_RPC_TOKEN: ${ARTICLE_USER_RPC_TOKEN:-}
      COMMENT_USER_RPC_TOKEN: ${COMMENT_USER_RPC_TOKEN:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck: *app-healthcheck

  scene:
    build:
      context: .
      dockerfile: scene/Dockerfile
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: on-failure
    healthcheck: *app-healthcheck

  food:
    build:
      context: .
      dockerfile: food/Dockerfile
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck: *app-healthcheck

  comment:
    build:
      context: .
      dockerfile: comment/Dockerfile
    ports:
      - "127.0.0.1:18003:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      COMMENT_USER_RPC_TOKEN: ${COMMENT_USER_RPC_TOKEN:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      user:
        condition: service_started
      article:
        condition: service_started
    restart: on-failure
    healthcheck: *app-healthcheck

  article:
    build:
      context: .
      dockerfile: article/Dockerfile
    ports:
      - "127.0.0.1:18004:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      ARTICLE_USER_RPC_TOKEN: ${ARTICLE_USER_RPC_TOKEN:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      user:
        condition: service_started
    restart: on-failure
    healthcheck: *app-healthcheck

  audiobook:
    build:
      context: .
      dockerfile: audiobook/Dockerfile
    ports:
      - "127.0.0.1:18005:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck: *app-healthcheck

  plan:
    build:
      context: .
      dockerfile: plan/Dockerfile
    ports:
      - "127.0.0.1:18006:8000"
    environment:
      ROAMING_AUTO_MIGRATE: "false"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck: *app-healthcheck

  ai:
    build: ./ai
    environment:
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      AI_DB_HOST: postgres
      AI_DB_PORT: "5432"
      AI_DB_USER: roaming
      AI_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      AI_DB_NAME: roaming_world
      AI_INGEST_TOKEN: ${AI_INGEST_TOKEN:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-hash}
      AI_EMBEDDING_API_URL: ${AI_EMBEDDING_API_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      MCP_URL: http://mcp:8000/mcp
      MCP_TOKEN: ${MCP_TOKEN:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-2.4t-a95b}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_BASE_URL: ${XIAOMI_BASE_URL:-https://api.xiaomimimo.com/v1}
      XIAOMI_MODEL: ${XIAOMI_MODEL:-mimo-v2.6-pro}
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mcp:
    build: ./mcp
    environment:
      SCENE_API: http://scene:8000
      FOOD_API: http://food:8000
      ARTICLE_API: http://article:8000
      MCP_TOKEN: ${MCP_TOKEN:-}
    depends_on:
      scene:
        condition: service_started
      food:
        condition: service_started
      article:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:18009:8000"
    environment:
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      NACOS_ADDR: nacos
      NACOS_PORT: "8848"
      NACOS_NAMESPACE_ID: ""
      NACOS_DATA_ID: roaming-world.yaml
      NACOS_GROUP_ID: DEFAULT_GROUP
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_LOG_LEVEL: ${NACOS_LOG_LEVEL:-warn}
      AI_ENGINE_URL: http://ai:8000
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    restart: on-failure
    healthcheck: *app-healthcheck

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  meili_data:
  nacos_data:
