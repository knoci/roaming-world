name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, user, scene, food, comment, article, audiobook, plan, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache-dependency-path: |
            ${{ matrix.module }}/go.mod
            ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            mcp/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt -r mcp/requirements.txt pytest ruff
      - name: Bytecode compile check
        run: python -m compileall -q ai mcp
      - name: Ruff fatal error lint
        run: ruff check --select E9,F63,F7,F82 ai mcp
      - name: Pytest
        env:
          PYTHONPATH: .
        run: |
          test_dirs="ai/tests"
          if [ -d mcp/tests ]; then
            test_dirs="$test_dirs mcp/tests"
          fi
          pytest -v $test_dirs
      - name: Offline AI Eval Gate
        env:
          PYTHONPATH: .
        run: python -m ai.evals.run_eval

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: roaming_world
          POSTGRES_USER: roaming
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roaming -d roaming_world"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_POSTGRES_DSN: postgres://roaming:ci_test_password@127.0.0.1:5432/roaming_world?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt pytest
      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: ci_test_password
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          for f in $(find deploy/postgres/migrations -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort); do
            echo "Applying $f"
            psql -h 127.0.0.1 -p 5432 -U roaming -d roaming_world -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Go integration tests (food)
        working-directory: food
        env:
          ROAMING_TEST_FOOD_POSTGRES_DSN: ${{ env.CI_POSTGRES_DSN }}
        run: go test -race -v ./...
      - name: Go integration tests (article)
        working-directory: article
        env:
          ROAMING_TEST_ARTICLE_POSTGRES_DSN: ${{ env.CI_POSTGRES_DSN }}
        run: go test -race -v ./...
      - name: Go integration tests (plan)
        working-directory: plan
        env:
          ROAMING_TEST_PLAN_POSTGRES_DSN: ${{ env.CI_POSTGRES_DSN }}
        run: go test -race -v ./...
      - name: Python AI integration tests
        env:
          PYTHONPATH: .
          ROAMING_TEST_AI_POSTGRES_DSN: ${{ env.CI_POSTGRES_DSN }}
        run: pytest -v ai/tests/test_article_visibility.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Compose config
        run: docker compose -f docker-compose.yml config -q
      - name: Kustomize render
        run: |
          kubectl kustomize k8s > /tmp/roaming-rendered.yaml
          kubectl kustomize k8s-single-node --load-restrictor LoadRestrictionsNone > /tmp/roaming-single.yaml
      - name: Migration SQL sync check
        run: |
          diff -ru deploy/postgres/migrations k8s/postgres-migrations
          diff -u deploy/postgres/reconcile_counts.sql k8s/reconcile_counts.sql
      - name: Secrets tracking guard
        run: |
          if git ls-files --error-unmatch k8s/secrets.yaml >/dev/null 2>&1; then
            echo "ERROR: k8s/secrets.yaml must not be tracked in git" >&2
            exit 1
          fi
      - name: Whitespace
        run: git diff --check
