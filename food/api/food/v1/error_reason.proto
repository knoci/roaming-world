syntax = "proto3";

package food.v1;

import "errors/errors.proto";

option go_package = "food/api/food/v1;v1";

enum ErrorReason {
  option (errors.default_code) = 500;
  
  NOT_FOUND = 0 [(errors.code) = 404];
  INVALID_ARGUMENT = 1 [(errors.code) = 400];
  UNAUTHORIZED = 2 [(errors.code) = 401];
  INTERNAL_ERROR = 3 [(errors.code) = 500];
}