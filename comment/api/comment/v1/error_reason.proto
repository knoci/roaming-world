syntax = "proto3";

package user.v1;

import "errors/errors.proto";

option go_package = "comment/api/comment/v1;v1";

// 错误原因枚举
enum ErrorReason {
  // 未知错误
  UNKNOWN = 0;
  // 用户不存在
  USER_NOT_FOUND = 1;
  // 评论不存在
  COMMENT_NOT_FOUND = 2;
  // 无权限操作
  NO_PERMISSION = 3;
  // 内部错误
  INTERNAL_ERROR = 4;
  // 未登录
  UNAUTHORIZED = 5;
  // 父评论不存在
  PARENT_COMMENT_NOT_FOUND = 6;
}